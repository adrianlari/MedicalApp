<?xml version="1.0" encoding="UTF-8"?>
<svg width="375" height="812" xmlns="http://www.w3.org/2000/svg">
  <!-- Phone Frame -->
  <rect width="375" height="812" fill="#f5f5f5"/>
  
  <!-- Status Bar -->
  <rect width="375" height="44" fill="#2196F3"/>
  <text x="187.5" y="30" font-family="Arial, sans-serif" font-size="16" fill="white" text-anchor="middle" font-weight="bold">9:41</text>
  
  <!-- Header -->
  <rect y="44" width="375" height="60" fill="#2196F3"/>
  <text x="187.5" y="80" font-family="Arial, sans-serif" font-size="20" fill="white" text-anchor="middle" font-weight="bold">Patients</text>
  
  <!-- Content Area -->
  <rect y="104" width="375" height="708" fill="#f5f5f5"/>
  
  <!-- Patient Card 1: John Doe -->
  <rect x="15" y="120" width="345" height="110" rx="10" fill="white" filter="url(#shadow)"/>
  <!-- Avatar Circle -->
  <circle cx="55" cy="175" r="30" fill="#2196F3"/>
  <text x="55" y="185" font-family="Arial, sans-serif" font-size="24" fill="white" text-anchor="middle" font-weight="bold">J</text>
  
  <!-- Patient Info -->
  <text x="100" y="165" font-family="Arial, sans-serif" font-size="18" fill="#212121" font-weight="bold">John Doe</text>
  <text x="100" y="185" font-family="Arial, sans-serif" font-size="14" fill="#757575">39 years old</text>
  <text x="100" y="205" font-family="Arial, sans-serif" font-size="14" fill="#757575">+1-555-0101</text>
  
  <!-- Blood Type Badge -->
  <rect x="310" y="165" width="35" height="24" rx="12" fill="#4CAF50"/>
  <text x="327.5" y="182" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="bold">O+</text>
  
  <!-- Patient Card 2: Jane Smith -->
  <rect x="15" y="245" width="345" height="110" rx="10" fill="white" filter="url(#shadow)"/>
  <!-- Avatar Circle -->
  <circle cx="55" cy="300" r="30" fill="#2196F3"/>
  <text x="55" y="310" font-family="Arial, sans-serif" font-size="24" fill="white" text-anchor="middle" font-weight="bold">J</text>
  
  <!-- Patient Info -->
  <text x="100" y="290" font-family="Arial, sans-serif" font-size="18" fill="#212121" font-weight="bold">Jane Smith</text>
  <text x="100" y="310" font-family="Arial, sans-serif" font-size="14" fill="#757575">36 years old</text>
  <text x="100" y="330" font-family="Arial, sans-serif" font-size="14" fill="#757575">+1-555-0102</text>
  
  <!-- Blood Type Badge -->
  <rect x="310" y="290" width="35" height="24" rx="12" fill="#4CAF50"/>
  <text x="327.5" y="307" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="bold">A+</text>
  
  <!-- Bottom Navigation Bar -->
  <rect y="712" width="375" height="100" fill="white" filter="url(#shadow-top)"/>
  <g>
    <!-- Dashboard Tab -->
    <text x="62.5" y="745" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" opacity="0.5">🏠</text>
    <text x="62.5" y="765" font-family="Arial, sans-serif" font-size="11" fill="#757575" text-anchor="middle">Dashboard</text>
    
    <!-- Patients Tab (Active) -->
    <rect x="125" y="712" width="125" height="4" fill="#2196F3"/>
    <text x="187.5" y="745" font-family="Arial, sans-serif" font-size="24" text-anchor="middle">👥</text>
    <text x="187.5" y="765" font-family="Arial, sans-serif" font-size="11" fill="#2196F3" text-anchor="middle" font-weight="600">Patients</text>
    
    <!-- Appointments Tab -->
    <text x="312.5" y="745" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" opacity="0.5">📅</text>
    <text x="312.5" y="765" font-family="Arial, sans-serif" font-size="11" fill="#757575" text-anchor="middle">Appointments</text>
  </g>
  
  <!-- Shadow Filter -->
  <defs>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.2"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow-top" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="-2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.15"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
</svg>
