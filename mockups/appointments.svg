<?xml version="1.0" encoding="UTF-8"?>
<svg width="375" height="812" xmlns="http://www.w3.org/2000/svg">
  <!-- Phone Frame -->
  <rect width="375" height="812" fill="#f5f5f5"/>
  
  <!-- Status Bar -->
  <rect width="375" height="44" fill="#2196F3"/>
  <text x="187.5" y="30" font-family="Arial, sans-serif" font-size="16" fill="white" text-anchor="middle" font-weight="bold">9:41</text>
  
  <!-- Header -->
  <rect y="44" width="375" height="60" fill="#2196F3"/>
  <text x="187.5" y="80" font-family="Arial, sans-serif" font-size="20" fill="white" text-anchor="middle" font-weight="bold">Appointments</text>
  
  <!-- Content Area -->
  <rect y="104" width="375" height="708" fill="#f5f5f5"/>
  
  <!-- Appointment Card 1 -->
  <rect x="15" y="120" width="345" height="140" rx="10" fill="white" filter="url(#shadow)"/>
  
  <!-- Patient Name -->
  <text x="25" y="145" font-family="Arial, sans-serif" font-size="18" fill="#212121" font-weight="bold">John Doe</text>
  
  <!-- Status Badge -->
  <rect x="265" y="130" width="85" height="24" rx="12" fill="#FF9800"/>
  <text x="307.5" y="147" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle" font-weight="bold">Scheduled</text>
  
  <!-- Doctor Info -->
  <text x="25" y="170" font-family="Arial, sans-serif" font-size="14" fill="#2196F3">🩺</text>
  <text x="45" y="170" font-family="Arial, sans-serif" font-size="14" fill="#212121">Dr. Sarah Johnson</text>
  <text x="175" y="170" font-family="Arial, sans-serif" font-size="14" fill="#757575">- Cardiology</text>
  
  <!-- Date/Time -->
  <text x="25" y="195" font-family="Arial, sans-serif" font-size="14" fill="#4CAF50">🕐</text>
  <text x="45" y="195" font-family="Arial, sans-serif" font-size="14" fill="#212121">Mar 02, 2026 - 10:00 AM</text>
  
  <!-- Reason -->
  <text x="25" y="220" font-family="Arial, sans-serif" font-size="14" fill="#757575">Regular checkup</text>
  <text x="25" y="240" font-family="Arial, sans-serif" font-size="12" fill="#9E9E9E" font-style="italic">Bring previous test results</text>
  
  <!-- Appointment Card 2 -->
  <rect x="15" y="275" width="345" height="130" rx="10" fill="white" filter="url(#shadow)"/>
  
  <!-- Patient Name -->
  <text x="25" y="300" font-family="Arial, sans-serif" font-size="18" fill="#212121" font-weight="bold">Jane Smith</text>
  
  <!-- Status Badge -->
  <rect x="270" y="285" width="80" height="24" rx="12" fill="#4CAF50"/>
  <text x="310" y="302" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle" font-weight="bold">Confirmed</text>
  
  <!-- Doctor Info -->
  <text x="25" y="325" font-family="Arial, sans-serif" font-size="14" fill="#2196F3">🩺</text>
  <text x="45" y="325" font-family="Arial, sans-serif" font-size="14" fill="#212121">Dr. Michael Chen</text>
  <text x="180" y="325" font-family="Arial, sans-serif" font-size="14" fill="#757575">- Pulmonology</text>
  
  <!-- Date/Time -->
  <text x="25" y="350" font-family="Arial, sans-serif" font-size="14" fill="#4CAF50">🕐</text>
  <text x="45" y="350" font-family="Arial, sans-serif" font-size="14" fill="#212121">Mar 05, 2026 - 02:30 PM</text>
  
  <!-- Reason -->
  <text x="25" y="375" font-family="Arial, sans-serif" font-size="14" fill="#757575">Asthma follow-up</text>
  
  <!-- Book Appointment Button -->
  <rect x="20" y="630" width="335" height="50" rx="25" fill="#2196F3" filter="url(#shadow)"/>
  <text x="187.5" y="660" font-family="Arial, sans-serif" font-size="16" fill="white" text-anchor="middle" font-weight="600">Book New Appointment</text>
  
  <!-- Bottom Navigation Bar -->
  <rect y="712" width="375" height="100" fill="white" filter="url(#shadow-top)"/>
  <g>
    <!-- Dashboard Tab -->
    <text x="62.5" y="745" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" opacity="0.5">🏠</text>
    <text x="62.5" y="765" font-family="Arial, sans-serif" font-size="11" fill="#757575" text-anchor="middle">Dashboard</text>
    
    <!-- Patients Tab -->
    <text x="187.5" y="745" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" opacity="0.5">👥</text>
    <text x="187.5" y="765" font-family="Arial, sans-serif" font-size="11" fill="#757575" text-anchor="middle">Patients</text>
    
    <!-- Appointments Tab (Active) -->
    <rect x="250" y="712" width="125" height="4" fill="#2196F3"/>
    <text x="312.5" y="745" font-family="Arial, sans-serif" font-size="24" text-anchor="middle">📅</text>
    <text x="312.5" y="765" font-family="Arial, sans-serif" font-size="11" fill="#2196F3" text-anchor="middle" font-weight="600">Appointments</text>
  </g>
  
  <!-- Shadow Filter -->
  <defs>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.2"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow-top" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="-2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.15"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
</svg>
